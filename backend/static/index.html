                            </div>
                            <div class="plugin-market-search-wrap">
                                <i class="ri-search-line plugin-market-search-icon"></i>
                                <input type="text" 
                                       class="plugin-market-search input-minimal" 
                                       :placeholder="t('searchPlugins')"
                                       x-model="pluginMarketSearch"
                                       :aria-label="t('searchPlugins')">
                            </div>
                        </div>
                        
                        <!-- Loading -->
                        <div class="plugin-loading" x-show="pluginMarketLoading">
                            <div class="spinner"></div>
                            <span x-text="t('refreshingMarket')"></span>
                        </div>
                        
                        <!-- Error -->
                        <div class="plugin-error" x-show="pluginMarketError && !pluginMarketLoading">
                            <i class="ri-error-warning-line icon-lg"></i>
                            <span x-text="t('networkError')"></span>
                            <button class="btn-secondary" @click="loadPluginMarket()" x-text="t('retry')"></button>
                        </div>
                        
                        <!-- Plugin Grid -->
                        <div class="plugin-grid" x-show="!pluginMarketLoading && !pluginMarketError">
                            <template x-for="plugin in filteredMarketPlugins" :key="plugin.id">
                                <div class="plugin-card plugin-card-market" x-data="{ infoOpen: false }" @click.outside="infoOpen = false">
                                    <img :src="getMarketPluginIconUrl(plugin)"
                                         class="plugin-icon plugin-icon-market" 
                                         width="36" height="36"
                                         @error="handleMarketPluginIconError($event, plugin)">
                                    <div class="plugin-card-market-body">
                                        <span class="plugin-name plugin-name-market" x-text="plugin.name[lang] || plugin.name.en"></span>
                                    </div>
                                    <div class="plugin-actions plugin-actions-market">
                                        <div class="plugin-info-wrap">
                                            <button class="btn-icon btn-icon-sm" 
                                                    @click="infoOpen = !infoOpen"
                                                    :aria-expanded="infoOpen"
                                                    :aria-label="t('pluginInfo')">
                                                <i class="ri-information-line"></i>
                                            </button>
                                            <div class="plugin-info-popover" x-show="infoOpen" x-cloak x-transition>
                                                <div class="plugin-info-popover-title" x-text="plugin.name[lang] || plugin.name.en"></div>
                                                <div class="plugin-info-popover-version" x-text="'v' + plugin.version"></div>
                                                <div class="plugin-info-popover-desc" x-text="plugin.description[lang] || plugin.description.en"></div>
                                            </div>
                                        </div>
                                        <button class="btn-icon btn-icon-sm" 
                                                @click="installPlugin(plugin)" 
                                                :disabled="isPluginInstalled(plugin.id) || pluginInstalling === plugin.id"
                                                :title="pluginInstalling === plugin.id ? t('installing') : (isPluginInstalled(plugin.id) ? t('installed') : t('install'))"
                                                :aria-label="t('installPlugin')">
                                            <i class="ri-loader-4-line spin" x-show="pluginInstalling === plugin.id"></i>
                                            <i class="ri-check-line" x-show="isPluginInstalled(plugin.id) && pluginInstalling !== plugin.id"></i>
                                            <i class="ri-download-2-line" x-show="!isPluginInstalled(plugin.id) && pluginInstalling !== plugin.id"></i>
                                        </button>
                                    </div>
                                </div>
                            </template>
                            <div x-show="filteredMarketPlugins.length === 0" class="plugin-empty" x-text="t('noPluginsAvailable')"></div>
                        </div>
                    </div>
                    
                    <!-- Installed Plugins Tab -->
                    <div x-show="pluginTab === 'installed'">
                        <div class="section-header">
                            <h2 class="section-title" x-text="t('installedPlugins')"></h2>
                            <p class="section-desc" x-text="t('installedPluginsDesc')"></p>
                        </div>
                        
                        <div class="plugin-grid" x-show="installedPlugins.length > 0">
                            <template x-for="plugin in installedPlugins" :key="plugin.id">
                                <div class="plugin-card plugin-card-market" x-data="{ infoOpen: false }" @click.outside="infoOpen = false">
                                    <img :src="'/api/plugins/' + encodeURIComponent(plugin.id) + '/icon'" 
                                         class="plugin-icon plugin-icon-market"
                                         width="36" height="36"
                                         @error="$el.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23666%22 stroke-width=%222%22><path d=%22M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z%22/></svg>'">
                                    <div class="plugin-card-market-body">
                                        <span class="plugin-name plugin-name-market" x-text="plugin.name?.[lang] || plugin.name?.en || plugin.name || plugin.id"></span>
                                    </div>
                                    <div class="plugin-actions plugin-actions-market">
                                        <div class="plugin-info-wrap">
                                            <button class="btn-icon btn-icon-sm" 
                                                    @click="infoOpen = !infoOpen"
                                                    :aria-expanded="infoOpen"
                                                    :aria-label="t('pluginInfo')">
                                                <i class="ri-information-line"></i>
                                            </button>
                                            <div class="plugin-info-popover" x-show="infoOpen" x-cloak x-transition>
                                                <div class="plugin-info-popover-title" x-text="plugin.name?.[lang] || plugin.name?.en || plugin.name || plugin.id"></div>
                                                <div class="plugin-info-popover-version" x-text="'v' + (plugin.version || '1.0.0')"></div>
                                                <div class="plugin-info-popover-desc" x-text="plugin.description?.[lang] || plugin.description?.en || ''"></div>
                                            </div>
                                        </div>
                                        <button class="btn-icon btn-icon-sm" @click="openPluginSettings(plugin)" :title="t('settings')">
                                            <i class="ri-settings-3-line"></i>
                                        </button>
                                        <button class="btn-icon btn-icon-sm btn-icon-danger" @click="uninstallPlugin(plugin)" :title="t('uninstall')">
                                            <i class="ri-delete-bin-line"></i>
                                        </button>
                                        <button role="switch" :aria-checked="plugin.enabled" class="toggle-switch" :class="{ 'checked': plugin.enabled }" @click="togglePlugin(plugin)">
                                            <span class="toggle-handle"></span>
                                        </button>
                                    </div>
                                </div>
                            </template>
                            <div x-show="installedPlugins.length === 0" class="plugin-empty" x-text="t('noPluginsInstalled')"></div>
                        </div>
                    </div>
                    
                    <!-- Install Local Plugin Tab -->
                    <div x-show="pluginTab === 'local'">
                        <div class="section-header">
                            <h2 class="section-title" x-text="t('installLocalPlugin')"></h2>
                            <p class="section-desc" x-text="t('installLocalPluginDesc')"></p>
                        </div>
                        
                        <div class="upload-area plugin-upload" @click="$refs.pluginFileInput.click()"
                            @dragover.prevent @drop.prevent="handlePluginDrop($event)">
                            <input type="file" x-ref="pluginFileInput" @change="handlePluginUpload($event)" accept=".zip" class="file-input-hidden">
                            <i class="ri-upload-2-line icon-xl"></i>
                            <div x-text="t('selectPluginZip')"></div>
                        </div>
                        
                        <!-- Upload progress -->
                        <div class="plugin-upload-progress" x-show="pluginUploading">
                            <div class="spinner"></div>
                            <span x-text="t('installing')"></span>
                        </div>
                        
                        <div class="plugin-dev-guide">
                            <a href="https://github.com/massif-01/ChatRaw/blob/main/Plugins/README.md" target="_blank" rel="noopener">
                                <i class="ri-external-link-line"></i>
                                <span x-text="t('pluginDevGuide')"></span>
                            </a>
                        </div>
                    </div>
                    
                </div>
                
                <!-- Modal Actions Footer -->
                <div class="modal-actions-bar">
                    <button class="btn-secondary" @click="showPlugins = false" x-text="t('close')"></button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Plugin Settings Modal -->
    <div class="modal-overlay" x-show="showPluginSettings" x-cloak @click.self="showPluginSettings = false" x-transition>
        <div class="plugin-settings-modal" :class="{ 'custom-settings-modal': currentPluginSettings?.customSettings }">
            <div class="plugin-settings-header" x-show="!currentPluginSettings?.customSettings">
                <h3 x-text="currentPluginSettings?.name?.[lang] || currentPluginSettings?.name?.en || currentPluginSettings?.id || ''"></h3>
            </div>
            <div class="plugin-settings-content" :class="{ 'custom-settings-content': currentPluginSettings?.customSettings }">
                <!-- Custom Settings Container (for plugins with customSettings: true) -->
                <template x-if="currentPluginSettings?.customSettings">
                    <div id="plugin-custom-settings-area" class="plugin-custom-settings">
                        <div class="plugin-loading-text" x-text="t('loading')"></div>
                    </div>
                </template>
                
                <!-- Standard Settings (only when no customSettings) -->
                <template x-if="!currentPluginSettings?.customSettings && currentPluginSettings?.settings?.length > 0">
                    <div>
                        <template x-for="setting in currentPluginSettings.settings" :key="setting.id">
                            <div class="form-group">
                                <label class="form-label" x-text="setting.label?.[lang] || setting.label?.en || setting.id"></label>
                                
                                <!-- Boolean -->
                                <template x-if="setting.type === 'boolean'">
                                    <button role="switch" :aria-checked="pluginSettingsValues[setting.id]" class="toggle-switch" :class="{ 'checked': pluginSettingsValues[setting.id] }" 
                                         @click="pluginSettingsValues[setting.id] = !pluginSettingsValues[setting.id]">
                                        <span class="toggle-handle"></span>
                                    </button>
                                </template>
                                
                                <!-- String -->
                                <template x-if="setting.type === 'string'">
                                    <input type="text" class="input-minimal" 
                                           x-model="pluginSettingsValues[setting.id]" 
                                           :placeholder="String(setting.default || '')">
                                </template>
                                
                                <!-- Number -->
                                <template x-if="setting.type === 'number'">
                                    <input type="number" class="input-minimal" 
                                           x-model.number="pluginSettingsValues[setting.id]"
                                           :min="setting.min" :max="setting.max"
                                           :placeholder="String(setting.default || '')">
                                </template>
                                
                                <!-- Select -->
                                <template x-if="setting.type === 'select'">
                                    <select class="input-minimal" x-model="pluginSettingsValues[setting.id]">
                                        <template x-for="(opt, idx) in (setting.options || [])" :key="setting.id + '-' + idx">
                                            <option :value="(typeof opt === 'object' && opt && 'value' in opt) ? opt.value : opt" x-text="(typeof opt === 'object' && opt && 'label' in opt) ? opt.label : opt"></option>
                                        </template>
                                    </select>
                                </template>
                                
                                <!-- Password -->
                                <template x-if="setting.type === 'password'">
                                    <input type="password" class="input-minimal" 
                                           x-model="pluginSettingsValues[setting.id]"
                                           placeholder="••••••••">
                                </template>
                            </div>
                        </template>
                    </div>
                </template>
                
                <!-- No Settings (only when no customSettings AND no standard settings) -->
                <template x-if="!currentPluginSettings?.customSettings && (!currentPluginSettings?.settings || currentPluginSettings.settings.length === 0)">
                    <div class="plugin-no-settings" x-text="t('noPluginSettings')"></div>
                </template>
                
                <!-- Proxy/API Key settings (only for non-custom settings plugins) -->
                <template x-if="!currentPluginSettings?.customSettings && currentPluginSettings && currentPluginSettings.proxy && currentPluginSettings.proxy.length > 0">
                    <div class="plugin-proxy-settings">
                        <h4 x-text="t('apiKeySettings')"></h4>
                        <template x-for="proxy in currentPluginSettings.proxy" :key="proxy.id">
                            <div class="form-group">
                                <label class="form-label" x-text="proxy.name?.[lang] || proxy.name?.en || proxy.id"></label>
                                <p class="form-sublabel" x-text="proxy.description?.[lang] || proxy.description?.en || ''"></p>
                                <input type="text" class="input-minimal" 
                                       x-model="pluginApiKeys[proxy.id]"
                                       :placeholder="pluginApiKeyConfigured[proxy.id] ? t('apiKeySet') : t('enterApiKey')"
                                       @input="pluginApiKeyActions[proxy.id] = 'replace'">
                                <p class="form-hint" x-show="pluginApiKeyConfigured[proxy.id] && pluginApiKeyActions[proxy.id] !== 'clear'" x-text="t('apiKeySet')"></p>
                                <button type="button" class="btn-secondary btn-compact"
                                        x-show="pluginApiKeyConfigured[proxy.id]"
                                        @click="pluginApiKeys[proxy.id] = ''; pluginApiKeyActions[proxy.id] = 'clear'">
                                    <span x-text="t('clearKey')"></span>
                                </button>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
            <div class="plugin-settings-footer" x-show="!currentPluginSettings?.customSettings">
                <button class="btn-secondary" @click="showPluginSettings = false" x-text="t('cancel')"></button>
                <button class="btn-primary" @click="savePluginSettings()" x-text="t('save')"></button>
            </div>
        </div>
    </div>

    <!-- Core-owned workspace mount for source-built Resident Integrations. -->
    <div class="modal-overlay resident-workspace-modal"
         x-show="residentWorkspace.show"
         x-cloak
         x-transition
         @click.self="closeResidentWorkspace()"
         @keydown.escape.window="residentWorkspace.show && closeResidentWorkspace()">
        <section class="resident-workspace-panel"
                 role="dialog"
                 aria-modal="true"
                 aria-labelledby="resident-workspace-title">
            <header class="resident-workspace-header">
                <h2 id="resident-workspace-title"
                    x-text="residentWorkspace.title"></h2>
                <button class="btn-icon"
                        type="button"
                        :aria-label="t('closeResidentIntegration')"
                        @click="closeResidentWorkspace()">
                    <i class="ri-close-line"></i>
                </button>
            </header>
            <div class="module-task-error"
                 x-show="residentWorkspace.error"
                 x-text="t('moduleOperationFailed')"></div>
            <div id="resident-workspace-mount"
                 class="resident-workspace-mount"></div>
        </section>
    </div>

    <!-- Core module task center. Modules never supply or inject this markup. -->
    <button class="module-task-center-trigger"
            type="button"
            x-show="moduleTaskAttentionViews().length > 0 && !moduleTaskUi.show"
            x-cloak
            @click="openModuleTaskCenter()">
        <i class="ri-stack-line"></i>
        <span x-text="t('tasks')"></span>
        <strong x-text="moduleTaskAttentionViews().length"></strong>
    </button>

    <div class="modal-overlay module-task-modal"
         x-show="moduleTaskUi.show"
         x-cloak
         x-transition
         @click.self="closeModuleTask()"
         @keydown.escape.window="moduleTaskUi.show && closeModuleTask()">
        <section class="module-task-panel"
                 role="dialog"
                 aria-modal="true"
                 aria-labelledby="module-task-title">
            <header class="module-task-header">
                <div>
                    <p class="module-task-eyebrow" x-text="t('moduleTask')"></p>
                    <h2 id="module-task-title"
                        x-text="moduleTaskUi.task?.action_id || t('task')"></h2>
                </div>
                <div class="module-task-header-actions">
                    <span class="model-badge"
                          x-text="moduleTaskUi.task ? stateLabel(moduleTaskUi.task.state) : t('loading')"></span>
                    <button class="btn-icon"
                            type="button"
                            :aria-label="t('closeTask')"
                            @click="closeModuleTask()">
                        <i class="ri-close-line"></i>
                    </button>
                </div>
            </header>

            <nav class="module-task-switcher"
                 :aria-label="t('moduleTasks')">
                <template x-for="view in moduleTaskViews()"
                          :key="view.task.task_id">
                    <button type="button"
                            :class="{ 'active': moduleTaskUi.task?.task_id === view.task.task_id }"
                            @click="selectModuleTask(view.task.task_id)">
                        <span x-text="view.task.action_id"></span>
                        <small x-text="stateLabel(view.task.state)"></small>
                        <i class="module-task-attention"
                           x-show="view.approval"
                           :aria-label="t('approvalRequired')"></i>
                    </button>
                </template>
            </nav>

            <div class="module-task-body">
                <div class="module-task-progress"
                     role="progressbar"
                     :aria-label="t('taskProgress')"
                     :aria-valuenow="Math.round(moduleTaskUi.progress * 100)"
                     aria-valuemin="0"
                     aria-valuemax="100">
                    <span :style="`width: ${Math.round(moduleTaskUi.progress * 100)}%`"></span>
                </div>
                <p class="section-desc"
                   x-show="moduleTaskUi.progressMessage"
                   x-text="moduleTaskUi.progressMessage"></p>

                <div class="module-task-error"
                     x-show="moduleTaskUi.error"
                     x-text="localizeError(moduleTaskUi.error, 'moduleOperationFailed')"></div>

                <section class="module-task-approval"
                         x-show="moduleTaskUi.approval">
                    <strong x-text="t('approvalRequired')"></strong>
                    <p x-text="t('approvalRequired')"></p>
                    <div class="plugin-actions">
                        <button class="btn-primary btn-compact"
                                type="button"
                                @click="resolveModuleTaskApproval('approve')" x-text="t('approve')"></button>
                        <button class="btn-secondary btn-compact"
                                type="button"
                                @click="resolveModuleTaskApproval('deny')" x-text="t('deny')"></button>
                    </div>
                </section>

                <section x-show="moduleTaskUi.output && !moduleTaskUi.inline">
                    <h3 class="module-task-section-title" x-text="t('output')"></h3>
                    <div class="module-task-output"
                         x-html="renderMarkdown(moduleTaskUi.output)"></div>
                </section>

                <p class="section-desc"
                   x-show="moduleTaskUi.inline"
                   x-text="t('resultInConversation')"></p>

                <section x-show="moduleTaskUi.artifacts.length > 0">
                    <h3 class="module-task-section-title" x-text="t('artifacts')"></h3>
                    <template x-for="artifact in moduleTaskUi.artifacts"
                              :key="artifact.artifact_ref">
                        <button class="module-task-artifact"
                                type="button"
                                @click="downloadVisibleModuleArtifact(artifact)">
                            <i class="ri-download-line"></i>
                            <span x-text="artifact.filename"></span>
                            <small x-text="t('artifactSize', { size: artifact.size })"></small>
                        </button>
                    </template>
                </section>
            </div>

            <footer class="module-task-footer">
                <span class="section-desc"
                      x-text="moduleTaskUi.task?.task_id || ''"></span>
                <button class="btn-secondary btn-compact"
                        type="button"
                        x-show="moduleTaskUi.task && !['succeeded', 'failed', 'cancelled'].includes(moduleTaskUi.task.state)"
                        @click="cancelVisibleModuleTask()" x-text="t('cancelTask')"></button>
            </footer>
        </section>
    </div>

    <div class="modal-overlay"
         x-show="resetUserPasswordDialog.show"
         x-cloak
         x-transition
         @click.self="closeManagedUserPasswordDialog()"
         @keydown.escape.window="resetUserPasswordDialog.show && closeManagedUserPasswordDialog()"
         role="dialog"
         aria-modal="true"
         aria-labelledby="reset-user-password-title">
        <section class="user-password-modal">
            <div class="section-header">
                <h2 class="section-title"
                    id="reset-user-password-title"
                    x-text="t('resetPasswordTitle')"></h2>
                <p class="section-desc"
                   x-text="t('resetPasswordDesc', { username: resetUserPasswordDialog.user?.username || '' })"></p>
            </div>
            <div class="form-group">
                <label class="form-label" x-text="t('newPassword')"></label>
                <input class="input-minimal"
                       type="password"
                       minlength="12"
                       autocomplete="new-password"
                       x-model="resetUserPasswordDialog.newPassword">
                <span class="form-sublabel form-sublabel-block" x-text="t('passwordMinimum')"></span>
            </div>
            <div class="form-group">
                <label class="form-label" x-text="t('confirmPassword')"></label>
                <input class="input-minimal"
                       type="password"
                       minlength="12"
                       autocomplete="new-password"
                       x-model="resetUserPasswordDialog.confirmPassword">
            </div>
            <div class="plugin-actions user-password-actions">
                <button class="btn-secondary"
                        type="button"
                        @click="closeManagedUserPasswordDialog()"
                        x-text="t('cancel')"></button>
                <button class="btn-primary"
                        type="button"
                        :disabled="!resetUserPasswordDialog.user || isAdminUserBusy(resetUserPasswordDialog.user.id)"
                        @click="submitManagedUserPasswordReset()"
                        x-text="t('savePassword')"></button>
            </div>
        </section>
    </div>

    <!-- Plugin Fullscreen Modal -->
    <div class="modal-overlay plugin-fullscreen-modal" 
         x-show="pluginFullscreenModal.show" 
         x-cloak
         x-transition
         @click.self="pluginFullscreenModal.closable && closePluginFullscreenModal()"
         @keydown.escape.window="pluginFullscreenModal.show && pluginFullscreenModal.closable && closePluginFullscreenModal()">
        <div class="plugin-fullscreen-content" x-html="pluginFullscreenModal.content"></div>
    </div>

    <script src="app.min.js?v=968cc864e094e0bc37ad7e8c7eab4cc6149b4cf457f2aafeca0378826a12e7ea"></script>
</body>
</html>
