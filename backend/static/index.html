<body x-data="app()" :data-theme="settings.ui_settings.theme_mode">
    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" x-show="isMobileView && !sidebarCollapsed" @click="closeSidebar()" x-transition:enter="fade-enter" x-transition:leave="fade-leave"></div>
    
    <!-- Sidebar -->
    <aside class="sidebar" :class="{ 'collapsed': sidebarCollapsed }">
        <div class="sidebar-header">
            <div class="logo" x-show="!sidebarCollapsed">
                <img x-show="settings.ui_settings.logo_data" :src="settings.ui_settings.logo_data" :alt="t('logoAlt')" class="logo-img" width="32" height="32">
                <span class="logo-text" x-text="settings.ui_settings.logo_text || 'JustChat'"></span>
            </div>
            <button class="btn-icon" @click="toggleSidebar()" :title="sidebarCollapsed ? t('expand') : t('collapse')" :aria-expanded="String(!sidebarCollapsed)" :aria-label="t('toggleSidebar')">
                <i class="ri-arrow-left-s-line" x-show="!sidebarCollapsed"></i>
                <i class="ri-arrow-right-s-line" x-show="sidebarCollapsed"></i>
            </button>
        </div>
        
        <button class="btn-new-chat" @click="createNewChat()" x-show="!sidebarCollapsed">
            <i class="ri-add-line"></i>
            <span x-text="t('newChat')"></span>
        </button>
        
        <button class="btn-new-chat-collapsed" @click="createNewChat()" x-show="sidebarCollapsed" :title="t('newChat')" :aria-label="t('newChat')">
            <i class="ri-add-line"></i>
        </button>

        <!-- Stable sidebar mount for source-built Resident Integrations. -->
        <div class="resident-sidebar-entries"
             x-show="!sidebarCollapsed && (residentEntries('sidebar').length > 0 || sidebarPluginButtons.length > 0)"
             x-cloak>
            <template x-for="entry in residentEntries('sidebar')"
                      :key="entry.integration.id + ':' + entry.id">
                <button class="resident-entry"
                        type="button"
                        :disabled="!entry.integration.feature?.available"
                        :title="entry.integration.feature?.available
                            ? residentText(entry.label)
                            : t('unavailable')"
                        @click="openResidentIntegration(entry.integration)">
                    <i :class="entry.icon"></i>
                    <span x-text="residentText(entry.label)"></span>
                    <small x-show="!entry.integration.feature?.available" x-text="t('unavailable')"></small>
                </button>
            </template>
            <template x-for="btn in sidebarPluginButtons" :key="btn.fullId">
                <button class="plugin-sidebar-entry"
                        type="button"
                        :disabled="btn.loading || btn.disabled"
                        :title="getPluginButtonLabel(btn)"
                        :class="{ 'active': btn.active, 'loading': btn.loading }"
                        @click="handlePluginButtonClick(btn, $event.currentTarget)">
                    <i :class="btn.loading ? 'ri-loader-4-line spin' : btn.icon"></i>
                    <span x-text="getPluginButtonLabel(btn)"></span>
                    <small x-show="getPluginButtonStatus(btn)" x-text="getPluginButtonStatus(btn)"></small>
                </button>
            </template>
        </div>
        <div class="resident-sidebar-collapsed"
             x-show="sidebarCollapsed && (residentEntries('sidebar').length > 0 || sidebarPluginButtons.length > 0)"
             x-cloak>
            <template x-for="entry in residentEntries('sidebar')"
                      :key="entry.integration.id + ':' + entry.id">
                <button class="btn-icon"
                        type="button"
                        :disabled="!entry.integration.feature?.available"
                        :title="residentText(entry.label)"
                        @click="openResidentIntegration(entry.integration)">
                    <i :class="entry.icon"></i>
                </button>
            </template>
            <template x-for="btn in sidebarPluginButtons" :key="btn.fullId">
                <button class="btn-icon plugin-sidebar-entry-collapsed"
                        type="button"
                        :disabled="btn.loading || btn.disabled"
                        :title="getPluginButtonLabel(btn)"
                        :class="{ 'active': btn.active, 'loading': btn.loading }"
                        @click="handlePluginButtonClick(btn, $event.currentTarget)">
                    <i :class="btn.loading ? 'ri-loader-4-line spin' : btn.icon"></i>
                </button>
            </template>
        </div>

        <div class="chat-list" x-show="!sidebarCollapsed">
            <template x-for="chat in chats" :key="chat.id">
                <div class="chat-item" :class="{ 'active': currentChatId === chat.id }" @click="selectChat(chat.id)">
                    <i class="ri-message-3-line"></i>
                    <span class="chat-title" x-text="chat.title"></span>
                    <button class="btn-delete" @click.stop="renameChat(chat)" :title="t('rename')">
                        <i class="ri-edit-line"></i>
                    </button>
                    <button class="btn-delete" @click.stop="deleteChat(chat.id)" :title="t('delete')">
                        <i class="ri-close-line"></i>
                    </button>
                </div>
            </template>
        </div>
        
        <button class="btn-clear-all" x-show="!sidebarCollapsed && chats.length > 0 && isAdmin()" @click="clearAllChats()" :title="t('clearAllChats')">
            <i class="ri-delete-bin-line"></i>
            <span x-text="t('clearAllChats')"></span>
        </button>

        <div class="sidebar-footer" x-show="!sidebarCollapsed">
            <button class="btn-plugins" x-show="isAdmin()" @click="openPluginsPanel()">
                <i class="ri-tools-line"></i>
                <span x-text="t('plugins')"></span>
            </button>
            <button class="btn-settings" @click="openSettingsPanel()">
                <i class="ri-settings-3-line"></i>
                <span x-text="t('settings')"></span>
            </button>
            <button class="btn-settings" @click="logout()">
                <i class="ri-logout-box-r-line"></i>
                <span x-text="me ? me.username : t('account')"></span>
            </button>
        </div>
        
        <button class="btn-icon sidebar-plugins-collapsed" @click="openPluginsPanel()" x-show="sidebarCollapsed && isAdmin()" :title="t('plugins')">
            <i class="ri-tools-line"></i>
        </button>
        <button class="btn-icon sidebar-settings-collapsed" @click="openSettingsPanel()" x-show="sidebarCollapsed" :title="t('settings')">
            <i class="ri-settings-3-line"></i>
        </button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Mobile Header -->
        <div class="mobile-header" x-show="isMobileView">
            <button class="btn-icon" @click="openSidebar()">
                <i class="ri-menu-line"></i>
            </button>
            <span class="mobile-title">ChatRaw</span>
        </div>

        <div class="plugin-workspace-layout"
             :class="pluginWorkspace.show ? 'workspace-' + pluginWorkspace.placement : ''">
        <div class="chat-container">
            <!-- Welcome - Pre-rendered for LCP optimization -->
            <div class="welcome" x-show="messages.length === 0">
                <div class="welcome-logo">
                    <img x-show="settings.ui_settings.logo_data" :src="settings.ui_settings.logo_data" :alt="t('logoAlt')" class="welcome-logo-img" width="80" height="80">
                </div>
                <h1 x-text="settings.ui_settings.logo_text || 'ChatRaw'">ChatRaw</h1>
                <p class="welcome-subtitle" x-text="settings.ui_settings.subtitle || t('defaultSubtitle')">Your minimalist AI assistant</p>
                
                <div class="welcome-features">
                    <div class="feature">
                        <i class="ri-flashlight-line"></i>
                        <span x-text="t('fastResponse')">Fast Response</span>
                    </div>
                    <div class="feature">
                        <i class="ri-tools-line"></i>
                        <span x-text="t('pluginMarket')">Plugin Market</span>
                    </div>
                    <div class="feature">
                        <i class="ri-computer-line"></i>
                        <span x-text="t('multiModel')">Multi-Model</span>
                    </div>
                </div>
            </div>

            <!-- Messages -->
            <div class="messages"
                 x-show="messages.length > 0"
                 x-ref="messagesContainer"
                 aria-live="polite">
                <template x-for="(msg, index) in messages"
                          :key="msg.id || msg._localId || index">
                    <div class="message" :class="msg.role">
                        <div class="message-avatar" :class="msg.role">
                            <!-- User avatar -->
                            <img x-show="msg.role === 'user' && settings.ui_settings.user_avatar" :src="settings.ui_settings.user_avatar" :alt="t('userAvatarAlt')" width="36" height="36" class="avatar-img">
                            <i class="ri-user-3-line" x-show="msg.role === 'user' && !settings.ui_settings.user_avatar"></i>
                            <!-- AI avatar -->
                            <img x-show="msg.role === 'assistant' && settings.ui_settings.assistant_avatar" :src="settings.ui_settings.assistant_avatar" :alt="t('assistantAvatarAlt')" width="36" height="36" class="avatar-img">
                            <i class="ri-robot-2-line" x-show="msg.role === 'assistant' && !settings.ui_settings.assistant_avatar"></i>
                        </div>
                        <div class="message-content">
                            <!-- Show typing indicator for empty assistant message while generating -->
                            <div class="typing-indicator" x-show="msg.role === 'assistant' && !msg.content && !msg.moduleTask && !(msg.hermesRun && msg.hermesRun.events && msg.hermesRun.events.length) && isGenerating">
                                <span></span><span></span><span></span>
                            </div>
                            <!-- Thinking/Reasoning Block -->
                            <div class="thinking-block" x-show="msg.thinking && msg.thinking.length > 0">
                                <div class="thinking-header" @click="msg.showThinking = !msg.showThinking" role="button" :aria-expanded="msg.showThinking">
                                    <i class="ri-lightbulb-line"></i>
                                    <span x-text="t('thinkingProcess')"></span>
                                    <i class="ri-arrow-down-s-line chevron" :class="{ 'expanded': msg.showThinking }"></i>
                                </div>
                                <div class="thinking-content" x-show="msg.showThinking" x-collapse>
                                    <div x-html="renderMarkdown(msg.thinking)"></div>
                                </div>
                            </div>

                            <!-- Core-owned Module task activity timeline -->
                            <template x-if="msg.moduleTask">
                                <section class="module-run-block"
                                         :class="'state-' + (msg.moduleTask.task?.state || 'queued')">
                                    <button class="module-run-header"
                                            type="button"
                                            @click="toggleModuleTaskTimeline(msg.moduleTask)"
                                            :aria-expanded="msg.moduleTask.timelineExpanded">
                                        <span class="module-run-heading">
                                            <i class="ri-pulse-line"></i>
                                            <span x-text="t('executionProcess')"></span>
                                            <small x-text="moduleTaskActivityList(msg.moduleTask).length"></small>
                                        </span>
                                        <span class="module-run-header-state">
                                            <span x-text="stateLabel(msg.moduleTask.task?.state)"></span>
                                            <i class="ri-arrow-down-s-line"
                                               :class="{ 'expanded': msg.moduleTask.timelineExpanded }"></i>
                                        </span>
                                    </button>

                                    <div class="module-run-body"
                                         x-show="msg.moduleTask.timelineExpanded"
                                         x-collapse>
                                        <div class="module-task-error"
                                             x-show="msg.moduleTask.error"
                                             x-text="localizeError(msg.moduleTask.error, 'moduleOperationFailed')"></div>

                                        <section class="module-task-approval"
                                                 x-show="msg.moduleTask.approval">
                                            <strong x-text="t('approvalRequired')"></strong>
                                            <p x-text="msg.moduleTask.approval?.prompt || t('approvalRequired')"></p>
                                            <div class="plugin-actions">
                                                <button class="btn-primary btn-compact"
                                                        type="button"
                                                        @click.stop="resolveModuleTaskApprovalFor(msg.moduleTask, 'approve')"
                                                        x-text="t('approve')"></button>
                                                <button class="btn-secondary btn-compact"
                                                        type="button"
                                                        @click.stop="resolveModuleTaskApprovalFor(msg.moduleTask, 'deny')"
                                                        x-text="t('deny')"></button>
                                            </div>
                                        </section>

                                        <div class="module-run-empty"
                                             x-show="moduleTaskActivityList(msg.moduleTask).length === 0 && !msg.moduleTask.error">
                                            <span class="module-run-pulse"></span>
                                            <span x-text="msg.moduleTask.activitiesLoaded ? t('noExecutionDetails') : t('waitingForExecutionDetails')"></span>
                                        </div>

                                        <ol class="module-run-timeline"
                                            x-show="moduleTaskActivityList(msg.moduleTask).length > 0">
                                            <template x-for="activity in moduleTaskActivityList(msg.moduleTask)"
                                                      :key="moduleTaskActivityKey(activity)">
                                                <li class="module-run-activity"
                                                    :class="[
                                                        'kind-' + activity.kind,
                                                        'state-' + activity.state,
                                                        { interrupted: activity.interrupted }
                                                    ]">
                                                    <span class="module-run-marker">
                                                        <i :class="moduleTaskActivityIcon(activity)"></i>
                                                    </span>
                                                    <div class="module-run-activity-content">
                                                        <div class="module-run-activity-header">
                                                            <strong x-text="activity.title"></strong>
                                                            <span class="module-run-activity-meta">
                                                                <span x-text="moduleTaskActivityState(activity)"></span>
                                                                <span x-show="activity.detail?.duration_ms !== undefined"
                                                                      x-text="formatModuleTaskDuration(activity.detail?.duration_ms)"></span>
                                                            </span>
                                                        </div>
                                                        <p x-show="activity.summary"
                                                           x-text="activity.summary"></p>

                                                        <ol class="module-run-plan"
                                                            x-show="activity.kind === 'plan'">
                                                            <template x-for="(step, stepIndex) in (activity.detail?.steps || [])"
                                                                      :key="stepIndex">
                                                                <li>
                                                                    <span x-text="stepIndex + 1"></span>
                                                                    <span x-text="step"></span>
                                                                </li>
                                                            </template>
                                                        </ol>

                                                        <details class="module-run-tool-details"
                                                                 x-show="activity.kind === 'tool'">
                                                            <summary>
                                                                <span x-text="activity.detail?.tool_name || t('tool')"></span>
                                                                <span x-text="t('viewDetails')"></span>
                                                            </summary>
                                                            <div class="module-run-preview"
                                                                 x-show="activity.detail?.arguments_preview !== undefined">
                                                                <span x-text="t('toolInput')"></span>
                                                                <pre><code x-text="activity.detail?.arguments_preview || ''"></code></pre>
                                                            </div>
                                                            <div class="module-run-preview"
                                                                 x-show="activity.detail?.result_preview !== undefined">
                                                                <span x-text="t('toolResult')"></span>
                                                                <pre><code x-text="activity.detail?.result_preview || ''"></code></pre>
                                                            </div>
                                                        </details>
                                                    </div>
                                                </li>
                                            </template>
                                        </ol>

                                        <div class="module-run-artifacts"
                                             x-show="msg.moduleTask.artifacts.length > 0">
                                            <span class="module-run-artifacts-label"
                                                  x-text="t('artifacts')"></span>
                                            <template x-for="artifact in msg.moduleTask.artifacts"
                                                      :key="artifact.artifact_ref">
                                                <button class="module-task-artifact"
                                                        type="button"
                                                        @click.stop="downloadModuleTaskArtifact(msg.moduleTask, artifact)">
                                                    <i class="ri-download-line"></i>
                                                    <span x-text="artifact.filename"></span>
                                                    <small x-text="t('artifactSize', { size: artifact.size })"></small>
                                                </button>
                                            </template>
                                        </div>
                                    </div>
                                </section>
                            </template>

                            <!-- Hermes Runs events -->
                            <template x-if="msg.hermesRun && msg.hermesRun.events && msg.hermesRun.events.length">
                                <div class="hermes-run-block">
                                    <div class="hermes-run-header">
                                        <div class="hermes-run-title">
                                            <i class="ri-terminal-box-line"></i>
                                            <span x-text="t('hermesRun')"></span>
                                        </div>
                                        <span class="hermes-run-status" :class="'status-' + (msg.hermesRun.status || 'running')" x-text="hermesRunStatusLabel(msg.hermesRun.status)"></span>
                                    </div>
                                    <div class="hermes-run-events">
                                        <template x-for="(event, eventIdx) in msg.hermesRun.events" :key="event._id || eventIdx">
                                            <div class="hermes-run-event" :class="hermesRunEventClass(event)">
                                                <div class="hermes-run-event-title">
                                                    <i :class="hermesRunEventIcon(event)"></i>
                                                    <span x-text="hermesRunEventTitle(event)"></span>
                                                    <span class="hermes-event-status" :class="'status-' + event.status" x-show="event.status" x-text="hermesRunStatusLabel(event.status)"></span>
                                                </div>
                                                <div class="hermes-run-event-body">
                                                    <div class="hermes-run-meta" x-show="event.tool || hasHermesDuration(event)">
                                                        <span x-show="event.tool">
                                                            <strong x-text="t('hermesRunTool')"></strong>
                                                            <span x-text="event.tool"></span>
                                                        </span>
                                                        <span x-show="hasHermesDuration(event)">
                                                            <strong x-text="t('hermesRunDuration')"></strong>
                                                            <span x-text="formatHermesDuration(event.duration_ms)"></span>
                                                        </span>
                                                    </div>
                                                    <template x-if="event.preview">
                                                        <div class="hermes-run-text">
                                                            <div class="hermes-run-text-label" x-text="t('hermesRunPreview')"></div>
                                                            <pre><code x-text="event.preview"></code></pre>
                                                        </div>
                                                    </template>
                                                    <template x-if="event.command">
                                                        <div class="hermes-run-text hermes-run-command">
                                                            <div class="hermes-run-text-label" x-text="t('hermesRunCommand')"></div>
                                                            <pre><code x-text="event.command"></code></pre>
                                                        </div>
                                                    </template>
                                                    <template x-if="event.description">
                                                        <div class="hermes-run-description">
                                                            <strong x-text="t('hermesRunDescription')"></strong>
                                                            <span x-text="event.description"></span>
                                                        </div>
                                                    </template>
                                                    <template x-if="event.pattern_keys && event.pattern_keys.length">
                                                        <div class="hermes-run-patterns">
                                                            <strong x-text="t('hermesRunPatterns')"></strong>
                                                            <template x-for="pattern in event.pattern_keys" :key="pattern">
                                                                <span class="hermes-run-pattern" x-text="pattern"></span>
                                                            </template>
                                                        </div>
                                                    </template>
                                                    <template x-if="event.error">
                                                        <div class="hermes-run-error" x-text="event.error"></div>
                                                    </template>
                                                    <template x-if="event.choice">
                                                        <div class="hermes-run-choice">
                                                            <strong x-text="t('hermesRunChoice')"></strong>
                                                            <span x-text="event.choice"></span>
                                                        </div>
                                                    </template>
                                                    <template x-if="isHermesPendingApprovalEvent(msg, event)">
                                                        <div class="hermes-approval-actions">
                                                            <button type="button" class="hermes-approval-btn" @click="submitHermesApproval(msg, 'once', index)" :disabled="msg.hermesRun.approvalSubmitting">
                                                                <span x-text="msg.hermesRun.approvalSubmitting ? t('hermesApprovalSubmitting') : t('hermesApprovalOnce')"></span>
                                                            </button>
                                                            <button type="button" class="hermes-approval-btn" @click="submitHermesApproval(msg, 'session', index)" :disabled="msg.hermesRun.approvalSubmitting">
                                                                <span x-text="t('hermesApprovalSession')"></span>
                                                            </button>
                                                            <button type="button" class="hermes-approval-btn danger" @click="submitHermesApproval(msg, 'deny', index)" :disabled="msg.hermesRun.approvalSubmitting">
                                                                <span x-text="t('hermesApprovalDeny')"></span>
                                                            </button>
                                                        </div>
                                                    </template>
                                                    <div class="hermes-approval-error" x-show="isHermesPendingApprovalEvent(msg, event) && msg.hermesRun.approvalError" x-text="msg.hermesRun.approvalError"></div>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                            
                            <!-- Show actual content -->
                            <div x-show="messageContent(msg)"
                                 x-html="renderMarkdown(messageContent(msg))"></div>
                            
                            <!-- Message Actions (assistant only) -->
                            <div class="message-actions" x-show="msg.role === 'assistant' && messageContent(msg) && !isGenerating">
                                <button class="btn-copy"
                                        @click="copyMessage(messageContent(msg), $event)"
                                        :title="t('copyMessage')">
                                    <i class="ri-file-copy-line"></i>
                                </button>
                                <div class="message-actions-plugin-slot" :data-msg-index="index"></div>
                            </div>
                            
                            <!-- RAG References -->
                            <div class="rag-references" x-show="msg.references && msg.references.length > 0">
                                <div class="rag-references-header" @click="msg.showRefs = !msg.showRefs" role="button" :aria-expanded="msg.showRefs">
                                    <i class="ri-file-text-line"></i>
                                    <span x-text="t('ragReferences') + ' (' + (msg.references?.length || 0) + ')'"></span>
                                    <i class="ri-arrow-down-s-line chevron" :class="{ 'expanded': msg.showRefs }"></i>
                                </div>
                                <div class="rag-references-list" x-show="msg.showRefs" x-collapse>
                                    <template x-for="(ref, refIdx) in msg.references" :key="refIdx">
                                        <div class="rag-reference-item">
                                            <div class="ref-header">
                                                <span class="ref-badge" x-text="'#' + (refIdx + 1)"></span>
                                                <span class="ref-score" x-text="t('relevance') + ': ' + (ref.score * 100).toFixed(0) + '%'"></span>
                                            </div>
                                            <div class="ref-content" x-text="ref.content.length > 200 ? ref.content.substring(0, 200) + '...' : ref.content"></div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
                
                <div class="message assistant" x-show="isGenerating && (!messages.length || messages[messages.length-1].role !== 'assistant')">
                    <div class="message-avatar assistant">
                        <img x-show="settings.ui_settings.assistant_avatar" :src="settings.ui_settings.assistant_avatar" :alt="t('assistantAvatarAlt')" width="36" height="36" class="avatar-img">
                        <i class="ri-robot-2-line" x-show="!settings.ui_settings.assistant_avatar"></i>
                    </div>
                    <div class="message-content">
                        <div class="typing-indicator">
                            <span></span><span></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-container-inner">
                    <div class="uploaded-image-preview" x-show="uploadedImage && chatModelSupportsVision()">
                        <img :src="uploadedImage ? 'data:image/jpeg;base64,' + uploadedImageBase64 : ''" :alt="t('preview')" width="60" height="60">
                        <button class="btn-delete-overlay" @click="removeUploadedImage()" :aria-label="t('removeImage')"><i class="ri-close-circle-fill"></i></button>
                    </div>
                    
                    <!-- Parsed URL Preview -->
                    <div class="parsed-url-preview" x-show="parsedUrl" x-cloak>
                        <i class="ri-link"></i>
                        <span class="parsed-url-title" x-text="parsedUrlTitle"></span>
                        <button class="btn-remove-url" @click="removeParsedUrl()" :aria-label="t('removeUrl')"><i class="ri-close-circle-fill"></i></button>
                    </div>
                    
                    <!-- Attached Document Preview -->
                    <div class="attached-doc-preview" x-show="attachedDocument" x-cloak>
                        <i class="ri-file-text-line"></i>
                        <span class="attached-doc-name" x-text="attachedDocument?.filename"></span>
                        <button class="btn-remove-doc" @click="removeAttachedDocument()" :aria-label="t('removeDocument')"><i class="ri-close-circle-fill"></i></button>
                    </div>

                    <!-- URL Input Popup -->
                    <div class="url-input-popup" x-show="showUrlInput" x-cloak @click.outside="cancelUrlInput()">
                        <div class="url-input-header" x-text="t('enterUrl')"></div>
                        <input
                            type="text"
                            x-model="urlInputValue"
                            :placeholder="t('urlPlaceholder')"
                            @keydown.enter="parseUrl()"
                            @keydown.escape="cancelUrlInput()"
                            :disabled="isParsingUrl"
                        >
                        <div class="url-input-actions">
                            <button class="btn-cancel" @click="cancelUrlInput()" x-text="t('cancel')"></button>
                            <button class="btn-confirm" @click="parseUrl()" :disabled="isParsingUrl || !urlInputValue.trim()">
                                <span x-show="!isParsingUrl" x-text="t('confirm')"></span>
                                <span x-show="isParsingUrl" x-text="t('parsing')"></span>
                            </button>
                        </div>
                    </div>

                    <div class="input-wrapper" @click.outside="closeCompletionMenu()">
                        <div class="composer-suggestions"
                             x-ref="composerSuggestions"
                             x-show="completionMenuOpen"
                             x-cloak
                             x-transition
                             role="listbox"
                             :aria-label="t('composerSuggestions')"
                             @mousedown.prevent>
                            <template x-for="(item, index) in completionItems" :key="item.providerId + ':' + item.id">
                                <button type="button"
                                        class="composer-suggestion-item"
                                        role="option"
                                        :class="{ 'active': index === completionActiveIndex }"
                                        :aria-selected="index === completionActiveIndex"
                                        @mouseenter="completionActiveIndex = index"
                                        @click="acceptCompletion(item)">
                                    <i :class="item.icon || 'ri-command-line'"></i>
                                    <span class="composer-suggestion-main">
                                        <span class="composer-suggestion-label" x-text="getLocalizedText(item.label, item.id)"></span>
                                        <span class="composer-suggestion-desc" x-text="getLocalizedText(item.description, item.source || '')"></span>
                                    </span>
                                    <span class="composer-suggestion-source" x-text="item.source || ''"></span>
                                </button>
                            </template>
                        </div>

                        <div class="composer-highlight"
                             x-ref="composerHighlight"
                             x-html="renderComposerHighlights(inputMessage)"
                             aria-hidden="true"></div>

                        <textarea 
                            x-model="inputMessage" 
                            @keydown="handleComposerKeydown($event)"
                            :placeholder="t('inputPlaceholder')"
                            rows="1"
                            x-ref="inputBox"
                            @input="handleComposerInput($event)"
                            @scroll="syncComposerHighlightScroll($event)"
                            @click="queueCompletionRefresh()"
                            @focus="queueCompletionRefresh()"
                            @compositionstart="handleCompositionStart()"
                            @compositionend="handleCompositionEnd($event)"
                        ></textarea>
                        
                        <div class="input-toolbar">
                            <!-- Thinking Mode Toggle -->
                            <div class="thinking-toggle" :class="{ 'active': useThinking }" @click="useThinking = !useThinking" :title="t('thinkingMode')">
                                <i class="ri-lightbulb-line"></i>
                                <div class="thinking-slider">
                                    <div class="thinking-slider-handle"></div>
                                </div>
                            </div>
                            <template x-if="chatModelSupportsVision()">
                                <label class="btn-tool btn-tool-upload" :title="t('uploadImage')">
                                    <input type="file" @change="handleImageUpload($event)" accept="image/*" class="file-input-hidden">
                                    <i class="ri-image-line"></i>
                                </label>
                            </template>
                            <label class="btn-tool btn-tool-upload" :title="t('uploadDocument')" :class="{ 'active': attachedDocument }">
                                <input type="file" @change="handleDocumentUpload($event)" :accept="getDocumentAcceptTypes()" class="file-input-hidden" :disabled="isUploadingDocument">
                                <i class="ri-file-text-line" x-show="!isUploadingDocument"></i>
                                <i class="ri-loader-4-line spin" x-show="isUploadingDocument"></i>
                            </label>
                            <button class="btn-tool" @click="toggleUrlInput()" :title="t('parseUrl')" :class="{ 'active': parsedUrl }">
                                <i class="ri-link"></i>
                            </button>

                            <!-- Stable composer mount for Resident Integrations. -->
                            <template x-for="entry in residentEntries('composer')"
                                      :key="entry.integration.id + ':' + entry.id">
                                <button class="btn-tool resident-composer-entry"
                                        type="button"
                                        :disabled="!entry.integration.feature?.available"
                                        :title="entry.integration.feature?.available
                                            ? residentText(entry.label)
                                            : t('unavailable')"
                                        @click="openResidentIntegration(entry.integration)">
                                    <i :class="entry.icon"></i>
                                </button>
                            </template>
                            
                            <!-- Plugin Toolbar Buttons Extension Area -->
                            <div class="plugin-toolbar-area" x-show="getSortedPluginButtons('toolbar').length > 0" x-cloak>
                                <div class="plugin-toolbar-divider"></div>
                                
                                <!-- Visible buttons (max 5) -->
                                <template x-for="btn in visiblePluginButtons" :key="btn.fullId">
                                    <button 
                                        class="btn-tool plugin-btn" 
                                        :class="{ 'active': btn.active, 'loading': btn.loading }"
                                        :title="getPluginButtonLabel(btn)"
                                        @click="handlePluginButtonClick(btn, $event.currentTarget)"
                                        :disabled="btn.loading || btn.disabled">
                                        <i :class="btn.loading ? 'ri-loader-4-line spin' : btn.icon"></i>
                                    </button>
                                </template>
                                
                                <!-- More menu (shown when > 5 buttons) -->
                                <div class="plugin-more-dropdown" x-show="hiddenPluginButtons.length > 0" x-cloak>
                                    <button class="btn-tool"
                                            type="button"
                                            x-ref="pluginMoreButton"
                                            @click="showPluginMoreMenu = !showPluginMoreMenu"
                                            :title="t('plugins')">
                                        <i class="ri-more-2-fill"></i>
                                    </button>
                                    <div class="plugin-more-menu" 
                                         x-show="showPluginMoreMenu" 
                                         x-cloak
                                         x-transition
                                         @click.outside="showPluginMoreMenu = false">
                                        <template x-for="btn in hiddenPluginButtons" :key="btn.fullId">
                                            <button class="plugin-more-item"
                                                 type="button"
                                                 :class="{ 'active': btn.active, 'loading': btn.loading, 'disabled': btn.disabled }"
                                                 :disabled="btn.loading || btn.disabled"
                                                 @click="handlePluginMoreButtonClick(btn, $refs.pluginMoreButton)">
                                                <i :class="btn.loading ? 'ri-loader-4-line spin' : btn.icon"></i>
                                                <span x-text="getPluginButtonLabel(btn)"></span>
                                            </button>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Send Button -->
                        <button class="btn-send" x-show="!isGenerating" @click="sendMessage()" :disabled="!inputMessage.trim()" :aria-label="t('send')">
                            <i class="ri-send-plane-2-line"></i>
                        </button>
                        <!-- Stop Button -->
                        <button class="btn-stop" x-show="isGenerating" @click="stopGeneration()" :title="t('stopGeneration')">
                            <i class="ri-stop-circle-line"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <section class="plugin-workspace-panel"
                 x-show="pluginWorkspace.show"
                 x-cloak
                 role="region"
                 aria-labelledby="plugin-workspace-title"
                 @keydown.escape.stop="closeActivePluginWorkspace()">
            <header class="plugin-workspace-header">
                <div class="plugin-workspace-heading">
                    <i :class="pluginWorkspace.icon" aria-hidden="true"></i>
                    <h2 id="plugin-workspace-title"
                        x-text="getLocalizedText(pluginWorkspace.title, pluginWorkspace.panelId || '')"></h2>
                </div>
                <button id="plugin-workspace-close"
                        class="btn-icon"
                        type="button"
                        :aria-label="t('close')"
                        @click="closeActivePluginWorkspace()">
                    <i class="ri-close-line"></i>
                </button>
            </header>
            <div id="plugin-workspace-mount"
                 class="plugin-workspace-mount"
                 x-ignore></div>
        </section>
        </div>

        <!-- Toast -->
        <div class="toast" x-show="toast.show" x-text="toast.message" :class="toast.type" x-transition></div>
    </main>

    <!-- New Settings Modal -->
    <div class="modal-overlay" x-show="showSettings" x-cloak @click.self="showSettings = false" @keydown.escape.window="showSettings && (showSettings = false)" x-transition role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
        <div class="settings-modal">
            <!-- Left Nav -->
            <div class="settings-nav" role="tablist" :aria-label="t('settingsNavigation')">
                <div class="settings-title" id="settings-modal-title" x-text="t('settings')"></div>
                <div class="nav-item" x-show="isAdmin()" role="tab" :aria-selected="settingsTab === 'models'" :class="{ 'active': settingsTab === 'models' }" @click="settingsTab = 'models'" x-text="t('modelConfig')"></div>
                <div class="nav-item" x-show="isAdmin()" role="tab" :aria-selected="settingsTab === 'chat'" :class="{ 'active': settingsTab === 'chat' }" @click="settingsTab = 'chat'" x-text="t('chatSettings')"></div>
                <div class="nav-item" x-show="isAdmin()" role="tab" :aria-selected="settingsTab === 'ui'" :class="{ 'active': settingsTab === 'ui' }" @click="settingsTab = 'ui'" x-text="t('uiSettings')"></div>
                <div class="nav-item" x-show="isAdmin()" role="tab" :aria-selected="settingsTab === 'users'" :class="{ 'active': settingsTab === 'users' }" @click="settingsTab = 'users'; loadAdminUsers()" x-text="t('users')"></div>
                <div class="nav-item" x-show="isAdmin()" role="tab" :aria-selected="settingsTab === 'modules'" :class="{ 'active': settingsTab === 'modules' }" @click="settingsTab = 'modules'; loadModules()" x-text="t('modules')"></div>
                <div class="nav-item" role="tab" :aria-selected="settingsTab === 'account'" :class="{ 'active': settingsTab === 'account' }" @click="settingsTab = 'account'" x-text="t('account')"></div>
                <div class="settings-footer">
                    © 2026 ChatRaw by massif-01<br>
                    <a href="https://opensource.org/licenses/MIT" target="_blank" rel="noopener" class="settings-footer-link" x-text="t('mitLicense')"></a>
                </div>
            </div>

            <!-- Right Content -->
            <div class="settings-content">
                <div class="settings-scroll-area">
                    
                    <!-- Models Tab -->
                    <div x-show="settingsTab === 'models'">
                        <div class="section-header">
                            <h2 class="section-title" x-text="t('modelConfig')"></h2>
                            <p class="section-desc" x-text="t('modelConfigDesc')"></p>
                        </div>
                        
                        <template x-for="(model, index) in models" :key="model.id || index">
                            <div class="model-card" x-show="model.type === 'chat'">
                                <div class="model-header">
                                    <span class="model-badge" x-text="getModelTypeName(model.type)"></span>
                                    <div class="model-status" :class="model.status || 'unknown'">
                                        <span x-show="model.status === 'success'" class="status-success" x-text="'● ' + t('active')"></span>
                                        <span x-show="model.status === 'error'" class="status-error" x-text="'● ' + t('error')"></span>
                                    </div>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label" x-text="t('apiEndpoint')"></label>
                                    <input type="text" class="input-minimal" x-model="model.api_url">
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label" x-text="t('apiKeyOptional')"></label>
                                    <input type="password" class="input-minimal"
                                           x-model="model.api_key"
                                           :placeholder="model.api_key_configured ? t('configuredReplace') : ''"
                                           @input="model.api_key_action = 'replace'">
                                    <button type="button" class="btn-secondary btn-compact"
                                            x-show="model.api_key_configured"
                                            @click="model.api_key = ''; model.api_key_action = 'clear'">
                                        <span x-text="t('clearKey')"></span>
                                    </button>
                                </div>

                                <div class="form-group">
                                    <label class="form-label" x-text="t('modelId')"></label>
                                    <input type="text" class="input-minimal" x-model="model.model_id">
                                </div>

                                <div class="form-group" x-show="model.type === 'chat'">
                                    <label class="form-label" x-text="t('capabilities')"></label>
                                    <div class="checkbox-group">
                                        <label class="checkbox-label">
                                            <input type="checkbox" x-model="model.capability.vision" @change="$nextTick(() => syncVisionCapabilityState())"> <span x-text="t('vision')"></span>
                                        </label>
                                        <label class="checkbox-label">
                                            <input type="checkbox" x-model="model.capability.reasoning"> <span x-text="t('reasoning')"></span>
                                        </label>
                                        <label class="checkbox-label">
                                            <input type="checkbox" x-model="model.capability.tools"> <span x-text="t('tools')"></span>
                                        </label>
                                    </div>
                                </div>
                                
                                <div class="form-group" x-show="model.type === 'chat'">
                                    <label class="form-label" x-text="t('contextLength')"></label>
                                    <input type="number" class="input-minimal" x-model.number="model.context_length" placeholder="8192">
                                </div>

                                <div class="form-group" x-show="model.type === 'chat'">
                                    <label class="form-label" x-text="t('maxOutput')"></label>
                                    <input type="number" class="input-minimal" x-model.number="model.max_output" placeholder="4096">
                                </div>

                                <button class="btn-primary btn-full-width" @click="saveAndVerifyModel(model, index)" :disabled="model.status === 'loading'">
                                    <span x-text="model.status === 'loading' ? t('verifying') : t('saveAndVerify')"></span>
                                </button>
                                <div class="model-verify-msg" x-show="model.verifyMessage" :class="model.status === 'success' ? 'status-success' : 'status-error'" x-text="model.verifyMessage"></div>
                            </div>
                        </template>
                    </div>
                    
                    <!-- Chat Settings Tab -->
                    <div x-show="settingsTab === 'chat'">
                        <div class="section-header">
                            <h2 class="section-title" x-text="t('chatSettings')"></h2>
                            <p class="section-desc" x-text="t('chatSettingsDesc')"></p>
                        </div>

                        <div class="form-group">
                            <div class="toggle-row">
                                <div class="toggle-info">
                                    <label class="form-label" x-text="t('streamOutput')"></label>
                                    <span class="form-sublabel" x-text="t('streamHint')"></span>
                                </div>
                                <button role="switch" :aria-checked="settings.chat_settings.stream" class="toggle-switch" :class="{ 'checked': settings.chat_settings.stream }" @click="settings.chat_settings.stream = !settings.chat_settings.stream">
                                    <span class="toggle-handle"></span>
                                </button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label"><span x-text="t('temperature')"></span>: <span x-text="settings.chat_settings.temperature"></span></label>
                            <input type="range" min="0" max="2" step="0.1" x-model.number="settings.chat_settings.temperature">
                            <span class="form-sublabel form-sublabel-inline" x-text="t('temperatureHint')"></span>
                        </div>

                        <!-- Top P Slider Restored -->
                        <div class="form-group">
                            <label class="form-label"><span x-text="t('topP')"></span>: <span x-text="settings.chat_settings.top_p"></span></label>
                            <input type="range" min="0" max="1" step="0.05" x-model.number="settings.chat_settings.top_p">
                            <span class="form-sublabel form-sublabel-inline" x-text="t('topPHint')"></span>
                        </div>

                        <!-- System Prompt -->
                        <div class="form-group">
                            <label class="form-label" x-text="t('systemPrompt')"></label>
                            <span class="form-sublabel form-sublabel-block" x-text="t('systemPromptHint')"></span>
                            <textarea 
                                class="system-prompt-textarea" 
                                x-model="settings.chat_settings.system_prompt"
                                :placeholder="t('systemPromptPlaceholder')"
                                rows="4"
                            ></textarea>
